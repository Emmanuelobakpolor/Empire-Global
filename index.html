<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empire Global | Financial Services</title>
    <meta name="description" content="Empire Global — Savings, Thrift, Investments, Loans and Hire Purchase, managed in one place." />
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B1B33;
        background-image: radial-gradient(circle at 50% 35%, rgba(16, 185, 129, 0.16), transparent 60%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #app-preloader.preloader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .preloader-ring-wrap {
        position: relative;
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 3px solid rgba(16, 185, 129, 0.16);
        border-top-color: #10B981;
        animation: preloader-spin 1s linear infinite;
      }
      .preloader-ring-outer {
        position: absolute;
        inset: -14px;
        border-radius: 9999px;
        border: 1px solid rgba(16, 185, 129, 0.14);
        animation: preloader-pulse 2.2s ease-in-out infinite;
      }
      .preloader-logo {
        width: 62px;
        height: 62px;
        object-fit: contain;
        animation: preloader-breathe 2.2s ease-in-out infinite;
        filter: drop-shadow(0 4px 14px rgba(16, 185, 129, 0.25));
      }
      .preloader-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ffffff;
      }
      .preloader-text span {
        color: #34d399;
      }
      .preloader-dots {
        display: flex;
        gap: 6px;
      }
      .preloader-dots span {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: #10B981;
        animation: preloader-dot 1.2s ease-in-out infinite;
      }
      .preloader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .preloader-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.12); opacity: 0.15; }
      }
      @keyframes preloader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes preloader-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-ring, .preloader-ring-outer, .preloader-logo, .preloader-dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader">
      <div class="preloader-inner">
        <div class="preloader-ring-wrap">
          <div class="preloader-ring-outer"></div>
          <div class="preloader-ring"></div>
          <img src="/logo.png" alt="" class="preloader-logo" />
        </div>
        <div class="preloader-text">EMPIRE <span>GLOBAL</span></div>
        <div class="preloader-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
